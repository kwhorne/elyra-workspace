[package]
name = "elyra-index"
description = "Tree-sitter symbol index: definitions and references per project, stored in SQLite (a rebuildable cache)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ignore = { workspace = true }
parking_lot = "0.12"
rusqlite = { workspace = true }
streaming-iterator = "0.1"
# The versions gpui-kit already links (one copy of each grammar's C symbols).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c = "0.24"

[dev-dependencies]
tempfile = "3"
