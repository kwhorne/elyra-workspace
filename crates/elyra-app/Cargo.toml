[package]
name = "elyra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Elyra Workspace — a focused desktop workspace for coding agents"

[[bin]]
name = "elyra"
path = "src/main.rs"

[dependencies]
elyra-core.workspace = true
elyra-provider.workspace = true
elyra-git.workspace = true
elyra-terminal.workspace = true
elyra-mcp.workspace = true
uuid.workspace = true
zip.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
async-channel.workspace = true
base64.workspace = true
ignore.workspace = true
which.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSError",
    "NSGeometry",
    "NSValue",
    "NSKeyValueObserving",
    "NSDictionary",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
    "NSDockTile",
    "NSView",
    "NSWindow",
    "NSEvent",
    "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKPreferences",
    "WKSnapshotConfiguration",
    "WKUIDelegate",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebpagePreferences",
    "WKWindowFeatures",
] }
