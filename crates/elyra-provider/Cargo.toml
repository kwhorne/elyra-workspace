[package]
name = "elyra-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["history"]
# Importing sessions from the agents' own history into Elyra Workspace
# transcripts (`claude_history`, `codex_history`).
history = ["dep:elyra-core"]

[dependencies]
elyra-agent-types.workspace = true
elyra-core = { workspace = true, optional = true }
uuid.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
async-channel.workspace = true
which.workspace = true
dirs.workspace = true
chrono.workspace = true

[[example]]
name = "claude_history"
required-features = ["history"]

[[example]]
name = "codex_history"
required-features = ["history"]
